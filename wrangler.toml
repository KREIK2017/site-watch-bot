name = "site-watch-bot"
main = "src/index.ts"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

# Headless Chromium fallback for JavaScript-rendered and challenged pages.
[browser]
binding = "BROWSER"

# Runs the checker for every active watch. Adjust frequency as needed
# (Cloudflare cron minimum granularity is 1 minute).
[triggers]
crons = ["*/5 * * * *"]

# Created via `npm run db:create`, then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "site-watch-bot-db"
database_id = "e5a07d7e-3cdb-43d1-96ca-490333733734"

# Secrets (set via `wrangler secret put`, never committed):
#   BOT_TOKEN          - Telegram bot token from @BotFather
#   WEBHOOK_SECRET     - random string, must match the secret_token used in setWebhook
#   ANTHROPIC_API_KEY  - optional; powers the AI change-summary feature (see README).
#                        Without it, watches fall back to a plain "content changed" line.
#   SCRAPER_SERVICE_URL   - optional; HTTPS URL of the VPS Playwright service.
#   SCRAPER_SERVICE_TOKEN - bearer token shared only with that service.
